BASE: ['']
TOOLBOX_MODE: "only_test"      # "train_and_test"  or "only_test"
TEST:
  METRICS: ['MAE', 'RMSE', 'MAPE', 'Pearson', 'SNR', 'BA']
  USE_LAST_EPOCH: False
  DATA:
    DATASET: PURE  # Dataset name triggers auto-load of dataset template (same as training config)
    DO_PREPROCESS: False                    # if first time, should be true
    BEGIN: 0.0
    END: 1.0
    PREPROCESS:
      # Only specify settings that differ from template (matching tscan_ubfc_rppg_to_pure.yaml TEST section)
      # The training config TEST section only overrides these settings, rest come from template
      COLOR_CHANNEL: 'B'  # Optional: 'R', 'G', or 'B' to extract single channel (must match training config if used)
      # With DATA_TYPE: ['DiffNormalized', 'Standardized'] and COLOR_CHANNEL: 'B', produces 2 channels:
      # Channel 0: DiffNormalized(B) for motion branch
      # Channel 1: Standardized(B) for appearance branch
      DATA_TYPE: ['DiffNormalized', 'Standardized']  # Must match training config
      LABEL_TYPE: DiffNormalized  # Must match training config
      CHUNK_LENGTH: 240  # Must match training config TEST section
      # Note: Other settings will come from PURE dataset template:
      # - DATA_AUG: ['None'] (from template)
      # - BACKEND: 'HC' (from template, training config doesn't override)
      # - All other CROP_FACE and RESIZE settings from template
DEVICE: cuda:0
NUM_OF_GPU_TRAIN: 1
LOG:
  PATH: runs/exp
MODEL:
  DROP_RATE: 0.2
  NAME: Tscan
  TSCAN:
    FRAME_DEPTH: 10
INFERENCE:
  BATCH_SIZE: 4
  EVALUATION_METHOD: FFT        # "FFT" or "peak detection"
  MODEL_PATH: "/home/yj167/Desktop/rPPG-Toolbox/scripts/train_runs/exp/UBFC-rPPG_ClipLength180_DataTypeDiffNormalized_Standardized_DataAugNone_LabelTypeDiffNormalized_Crop_faceTrue_BackendHC_Large_boxTrue_Large_size1.5_Dyamic_DetFalse_det_len30_Median_face_boxFalse_SizeW128_SizeH128/PreTrainedModels/Best_Tscan.pth"  
  # MODEL_PATH could only be set manually because the path of directory is generated by the training script
