# Experiment: DeepPhys model trained on PURE (infraorbital), tested on UBFC-rPPG (infraorbital)
# This is the infraorbital version of deepphys_pure_to_ubfc_rppg.yaml
# Cross-dataset: train/valid on PURE-IN, test on UBFC-rPPG-IN.
#
# MINIMAL CONFIG: Only experiment-specific settings!
# All preprocessing, paths, formats auto-load from dataset templates.
# DATA_PATH is determined by the dataset template (pure_in.yaml, ubfc_rppg_in.yaml).

BASE: ['../base/models/deepphys.yaml']

TOOLBOX_MODE: "train_and_test"

# Training configuration - ONLY experiment-specific settings
TRAIN:
  BATCH_SIZE: 4
  EPOCHS: 30
  LR: 1e-3
  MODEL_FILE_NAME: deepphys_pure_to_ubfc_rppg_in
  PLOT_LOSSES_AND_LR: True
  DATA:
    DATASET: PURE-IN  # Dataset name triggers auto-load of infraorbital template
    BEGIN: 0.0     # Experiment-specific: training split start
    END: 0.8       # Experiment-specific: training split end
    PREPROCESS:
      DATA_TYPE: ['DiffNormalized', 'Standardized']
      LABEL_TYPE: DiffNormalized
      CHUNK_LENGTH: 240
      # COLOR_CHANNEL: 'G'  # Extract single channel: 'R', 'G', or 'B' (must match across TRAIN/VALID/TEST)
      RESIZE:
        H: 96
        W: 96

# Validation configuration - ONLY experiment-specific settings
VALID:
  DATA:
    DATASET: PURE-IN  # Same dataset as training (infraorbital)
    BEGIN: 0.8     # Experiment-specific: validation split start
    END: 1.0      # Experiment-specific: validation split end
    PREPROCESS:
      DATA_TYPE: ['DiffNormalized', 'Standardized']
      LABEL_TYPE: DiffNormalized
      CHUNK_LENGTH: 240
      # COLOR_CHANNEL: 'G'  # Must match TRAIN
      RESIZE:
        H: 96
        W: 96

# Test configuration - ONLY experiment-specific settings
TEST:
  METRICS: ['MAE', 'RMSE', 'MAPE', 'Pearson', 'SNR', 'BA']
  USE_LAST_EPOCH: false
  DATA:
    DATASET: UBFC-rPPG-IN  # Different dataset for cross-dataset testing (infraorbital)
    BEGIN: 0.0          # Experiment-specific: test split start
    END: 1.0            # Experiment-specific: test split end
    PREPROCESS:
      DATA_TYPE: ['DiffNormalized', 'Standardized']
      LABEL_TYPE: DiffNormalized
      CHUNK_LENGTH: 180  # Match training for model consistency
      # COLOR_CHANNEL: 'G'  # Must match TRAIN
      RESIZE:
        H: 96
        W: 96
      # Note: This chunk length is also used for metrics evaluation (per-chunk metrics)

# Test-time batch size (smaller to avoid OOM with long chunks)
INFERENCE:
  BATCH_SIZE: 1
