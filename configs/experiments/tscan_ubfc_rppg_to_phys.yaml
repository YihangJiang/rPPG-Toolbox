# Experiment: TSCAN model trained on UBFC-rPPG, tested on UBFC-PHYS
# This replaces: UBFC-rPPG_UBFC-rPPG_UBFC-PHYS_TSCAN_BASIC.yaml
# 
# MINIMAL CONFIG: Only experiment-specific settings!
# All preprocessing, paths, formats auto-load from dataset templates.

BASE: ['../base/models/tscan.yaml']

TOOLBOX_MODE: "train_and_test"

# Training configuration - ONLY experiment-specific settings
TRAIN:
  BATCH_SIZE: 4
  EPOCHS: 30
  LR: 9e-3
  MODEL_FILE_NAME: tscan_ubfc_rppg_to_phys
  PLOT_LOSSES_AND_LR: True
  DATA:
    DATASET: UBFC-rPPG  # Dataset name triggers auto-load of all preprocessing/paths
    BEGIN: 0.0          # Experiment-specific: training split start
    END: 0.8            # Experiment-specific: training split end
    PREPROCESS:
      DATA_TYPE: ['DiffNormalized', 'Standardized']
      LABEL_TYPE: DiffNormalized  # Use DiffNormalized labels
      CHUNK_LENGTH: 180  # Override: template uses 700, but BASIC config uses 180
      # COLOR_CHANNEL: 'R'  # Extract single channel: 'R', 'G', or 'B' (must match across TRAIN/VALID/TEST)
      RESIZE:
        H: 96  # Explicitly set resize dimensions
        W: 96  # Explicitly set resize dimensions

# Validation configuration - ONLY experiment-specific settings
VALID:
  DATA:
    DATASET: UBFC-rPPG  # Same dataset as training
    BEGIN: 0.8          # Experiment-specific: validation split start
    END: 1.0            # Experiment-specific: validation split end
    PREPROCESS:
      DATA_TYPE: ['DiffNormalized', 'Standardized']  # Must match TRAIN for consistent model input
      LABEL_TYPE: DiffNormalized  # Use DiffNormalized labels
      CHUNK_LENGTH: 180  # Override: template uses 700, but BASIC config uses 180
      # COLOR_CHANNEL: 'R'  # Extract single channel: 'R', 'G', or 'B' (must match TRAIN)
      RESIZE:
        H: 96  # Explicitly set resize dimensions
        W: 96  # Explicitly set resize dimensions

# Test configuration - ONLY experiment-specific settings
TEST:
  METRICS: ['MAE', 'RMSE', 'MAPE', 'Pearson', 'SNR', 'BA']
  USE_LAST_EPOCH: false
  DATA:
    DATASET: UBFC-PHYS  # Different dataset for cross-dataset testing
    BEGIN: 0.0          # Experiment-specific: test split start
    END: 1.0            # Experiment-specific: test split end
    PREPROCESS:
      DATA_TYPE: ['DiffNormalized', 'Standardized']  # Must match TRAIN for consistent model input
      LABEL_TYPE: DiffNormalized  # Use DiffNormalized labels
      CHUNK_LENGTH: 700  # Override: template uses 700, but BASIC config uses 180
      # COLOR_CHANNEL: 'R'  # Extract single channel: 'R', 'G', or 'B' (must match TRAIN)
      RESIZE:
        H: 96  # Override: match training dataset size for model consistency
        W: 96  # Override: match training dataset size for model consistency
      # Note: This chunk length is also used for metrics evaluation (per-chunk metrics)

# Test-time batch size (smaller to avoid OOM with long chunks)
INFERENCE:
  BATCH_SIZE: 1


